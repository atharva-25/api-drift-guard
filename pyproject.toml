[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "api-drift-guard"
version = "0.1.0"
description = "Cross-service REST API compatibility analyzer for Python consumers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "google-adk>=2.12,<3",
    # ADK's LiteLLM connector requires >=1.84 (also excludes the compromised 1.82.7/1.82.8).
    "litellm>=1.84",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
api-drift-guard = "api_drift_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/api_drift_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted by LiteLLM's own TypedDicts when pydantic builds their schema.
    "ignore:Item .* is using the `ReadOnly` qualifier:UserWarning",
    # Starlette's TestClient (used only by tests/test_demo.py) suggests a different HTTP client.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
